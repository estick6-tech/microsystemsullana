<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="">
<title>MICROSYSTEMSULLANA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="header">
  <div class="container navbar">
    <a href="#inicio" class="logo"><span class="logo-icon"><i class="fa-solid fa-microchip"></i></span><span data-texto="negocio.nombre"></span></a>
    <nav class="nav-links" id="navLinks"></nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
  </div>
</header>

<section class="hero" id="inicio"><div class="container"><div class="hero-content reveal" id="heroContent"></div></div></section>

<section class="section services" id="servicios"><div class="container">
  <div class="section-title reveal" id="serviciosTitulo"></div>
  <div class="services-grid" id="serviciosGrid"></div>
</div></section>

<section class="section systems" id="sistemas"><div class="container systems-grid" id="sistemasGrid"></div></section>

<section class="section why"><div class="container">
  <div class="section-title reveal" id="porqueTitulo"></div>
  <div class="why-grid" id="porqueGrid"></div>
</div></section>

<section class="section gallery"><div class="container">
  <div class="section-title reveal" id="galeriaTitulo"></div>
  <div class="gallery-grid" id="galeriaGrid"></div>
</div></section>

<section class="stats"><div class="container stats-grid" id="statsGrid"></div></section>

<section class="cta"><div class="container"><div class="cta-box reveal" id="ctaBox"></div></div></section>

<section class="section contact" id="contacto"><div class="container contact-grid">
  <div class="contact-info reveal" id="contactoInfo"></div>
  <div class="contact-form reveal">
    <form id="contactForm"><div class="form-grid">
      <div class="form-group"><label for="nombre">Nombre</label><input id="nombre" required placeholder="Tu nombre"></div>
      <div class="form-group"><label for="telefono">Teléfono</label><input id="telefono" type="tel" required placeholder="Tu teléfono"></div>
      <div class="form-group full"><label for="servicio">Servicio</label><select id="servicio" required></select></div>
      <div class="form-group full"><label for="mensaje">Mensaje</label><textarea id="mensaje" required placeholder="Cuéntanos qué necesitas..."></textarea></div>
      <div class="form-group full"><button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i>Enviar consulta</button></div>
    </div></form>
  </div>
</div></section>

<footer><div class="container">
  <div class="footer-content">
    <div class="footer-logo"><i class="fa-solid fa-microchip"></i><span data-texto="negocio.nombre"></span></div>
    <div class="social" id="redes"></div>
  </div>
  <div class="copyright">© <span id="year"></span> <span data-texto="negocio.nombre"></span> · <span data-texto="footer.texto"></span></div>
</div></footer>

<a href="#" class="whatsapp" id="whatsappFlotante" target="_blank" rel="noopener" aria-label="Contactar por WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>

<!-- 1) Primero el contenido, 2) luego el código que lo dibuja -->
<script src="js/contenido.js"></script>
<script src="js/main.js"></script>
</body>
</html>
